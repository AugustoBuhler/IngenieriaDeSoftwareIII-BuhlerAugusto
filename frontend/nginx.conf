server {
    listen 80;

    # La SPA: estaticos, con fallback a index.html para las rutas del router.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # UN SOLO resolver, el de Docker. Agregar un DNS publico "por las dudas" hace
    # que nginx reparta las consultas entre los dos, y el publico no sabe que es
    # `backend`: el resultado son 502 intermitentes con todo sano.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El nombre del backend va en una VARIABLE, no escrito directo en proxy_pass.
    # Con el nombre directo nginx lo resuelve AL ARRANCAR y, si el backend
    # todavia no existe, se niega a levantar ("host not found in upstream").
    # Con variable, resuelve recien cuando llega un pedido.
    set $backend_api http://backend:8080;

    location /api/ {
        # SIN barra al final. Con barra, nginx reescribe el prefijo y manda
        # /api/turnos a /turnos: la API devuelve 404 en todas las llamadas.
        proxy_pass $backend_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
